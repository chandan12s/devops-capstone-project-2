apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: analytics
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      server {
        listen 80;
        server_name _;

        location /health {
          return 200 'webapp-healthy\n';
          add_header Content-Type text/plain;
        }

        location /api/ {
          proxy_pass http://analytics-api-svc:80;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
          return 200 'Analytics Platform - Enterprise Deployment v1.0\n';
          add_header Content-Type text/plain;
        }
      }
    }
