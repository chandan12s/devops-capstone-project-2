apiVersion: v1
kind: Service
metadata:
  name: analytics-webapp-svc
  namespace: analytics
  labels:
    app: analytics-webapp
    environment: dev
spec:
  type: NodePort
  selector:
    app: analytics-webapp
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30081
