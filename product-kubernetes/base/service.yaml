apiVersion: v1
kind: Service
metadata:
  name: analytics-api-svc
  namespace: analytics
  labels:
    app: analytics-api
    environment: dev
spec:
  type: NodePort
  selector:
    app: analytics-api
  ports:
    - name: http
      protocol: TCP
      port: 80          # cluster-internal port
      targetPort: 5000  # container port
      nodePort: 30080   # external port on EC2 — we opened 30000-32767 in SG
