apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-processor
  namespace: analytics
  labels:
    app: analytics-processor
    version: "1.0.0"
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-processor
  template:
    metadata:
      labels:
        app: analytics-processor
        version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: analytics-processor
          image: chandans12/analytics-processor:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: analytics-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-secrets
                  key: db-password
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
