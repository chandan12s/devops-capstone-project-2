apiVersion: v1
kind: Service
metadata:
  name: analytics-api-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.api.name }}
    customer: {{ .Release.Name }}
spec:
  type: NodePort
  selector:
    app: {{ .Values.api.name }}
    customer: {{ .Release.Name }}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: {{ .Values.api.port }}
      nodePort: {{ .Values.api.nodePort }}
