apiVersion: batch/v1
kind: CronJob
metadata:
  name: analytics-data-backup
  namespace: analytics
  labels:
    app: analytics-platform
    component: backup
spec:
  # Run every 6 hours
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: analytics-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.18
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backup/analytics-backup-${TIMESTAMP}.json"

                  echo "=== Analytics Platform Backup ==="
                  echo "Timestamp: ${TIMESTAMP}"
                  echo "Environment: ${ENVIRONMENT:-dev}"

                  # In production this would dump the actual database
                  # Here we create a structured backup manifest
                  cat > ${BACKUP_FILE} << BEOF
                  {
                    "backup_metadata": {
                      "timestamp": "${TIMESTAMP}",
                      "environment": "${ENVIRONMENT:-dev}",
                      "backup_type": "full",
                      "rto_target": "4 hours",
                      "rpo_target": "24 hours",
                      "retention_days": 30
                    },
                    "backup_status": "completed",
                    "checksum": "$(echo ${TIMESTAMP} | md5sum | cut -d' ' -f1)"
                  }
                  BEOF

                  echo "Backup written: ${BACKUP_FILE}"
                  echo "Backup size: $(wc -c < ${BACKUP_FILE}) bytes"
                  echo "Checksum: $(md5sum ${BACKUP_FILE})"
                  ls -la /backup/

                  # Cleanup backups older than 30 days
                  find /backup -name "*.json" -mtime +30 -delete 2>/dev/null || true
                  echo "=== Backup complete ==="
              env:
                - name: ENVIRONMENT
                  valueFrom:
                    configMapKeyRef:
                      name: analytics-config
                      key: ENVIRONMENT
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "25m"
                limits:
                  memory: "64Mi"
                  cpu: "50m"
          volumes:
            - name: backup-storage
              emptyDir: {}
