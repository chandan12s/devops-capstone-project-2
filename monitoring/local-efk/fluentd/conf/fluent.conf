# Read logs directly from Docker API via socket
# This approach works reliably on WSL2 + Docker Desktop
<source>
  @type exec
  command docker logs analytics-api-local --timestamps 2>&1
  tag analytics.api
  run_interval 10s
  <parse>
    @type none
  </parse>
</source>

<source>
  @type exec
  command docker logs analytics-processor-local --timestamps 2>&1
  tag analytics.processor
  run_interval 10s
  <parse>
    @type none
  </parse>
</source>

# Enrich records
<filter analytics.**>
  @type record_transformer
  <record>
    environment local-dev
    platform docker-desktop
    app ${tag}
    collected_at ${time}
  </record>
</filter>

# Ship to Elasticsearch
<match analytics.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix analytics-local
  include_tag_key true
  tag_key @log_tag
  <buffer>
    flush_interval 5s
    retry_max_times 5
    retry_wait 1s
  </buffer>
</match>